syntax = "proto3";

// Copia del contrato publicado por Telemetry & Data Ingestion
// (ventrax-upc/smartgn-telemetry-data-ingestion: src/Smartgn.Telemetry/Protos/telemetry_query.proto).
// El package y los campos deben ser IGUALES al del servidor; solo cambia el namespace C# del cliente.
option csharp_namespace = "Com.Ventrax.Monitoring.Infrastructure.Clients.Telemetry";

package smartgn.telemetry.v1;

service TelemetryQueryService {
  // Readings between two instants for the given devices, newest first.
  rpc GetReadingsBatch (ReadingsBatchRequest) returns (ReadingsBatchResponse);
  // Latest stored reading per requested device.
  rpc GetLatestReadings (LatestReadingsRequest) returns (LatestReadingsResponse);
}

message ReadingsBatchRequest {
  repeated string device_ids = 1;
  int64 from_unix_ms = 2;
  int64 to_unix_ms = 3;
  int32 limit = 4;
  repeated string supply_point_ids = 5;
  string account_id = 6;
}

message LatestReadingsRequest {
  repeated string device_ids = 1;
  int32 limit = 2;
  repeated string supply_point_ids = 3;
  string account_id = 4;
}

message Reading {
  string device_id = 1;
  string event_id = 2;
  int64 sequence_number = 3;
  int64 measured_at_unix_ms = 4;
  int64 received_at_unix_ms = 5;
  map<string, double> metrics = 6;
  // current | delayed — delayed means measuredAt is older than 30 seconds.
  string freshness = 7;
  int64 association_version = 8;
  string supply_point_id = 9;
}

message ReadingsBatchResponse {
  repeated Reading readings = 1;
}

message LatestReadingsResponse {
  repeated Reading readings = 1;
}
